<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matemaatikamaa</title><style>:root{font-family:system-ui,sans-serif;color:#18304c;background:#eef5ff}*{box-sizing:border-box}body{margin:0;padding:24px}.app{max-width:720px;margin:auto}header{text-align:center}h1{font-size:clamp(2rem,6vw,3rem);margin-bottom:0}header p{color:#58708b}.panel{background:white;border-radius:22px;padding:24px;margin:18px 0;box-shadow:0 8px 25px #254a8012}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:grid;gap:6px;font-weight:650}select,input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #cad8e8}button{background:#3069d6;color:white;border:0;cursor:pointer;font-weight:700}button.secondary{background:#e5edfc;color:#234c9c}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffbf47}button:disabled{opacity:.5}.question{text-align:center;font-size:clamp(2.5rem,8vw,4rem);font-weight:800;margin:20px 0}.answer{display:flex;gap:10px}.answer input{width:100%;min-width:0}.answer button{white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat{background:#f1f6ff;padding:14px 4px;border-radius:12px}.stat strong{display:block;font-size:1.5rem}.status{min-height:30px;text-align:center;font-weight:700}.success{color:#147744}.error{color:#b43b35}.footer{text-align:center;color:#667b91;font-size:.9rem}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}@media(max-width:500px){body{padding:12px}.panel{padding:17px}.controls{grid-template-columns:1fr}.answer{flex-direction:column}}</style></head><body><main class="app"><header><h1>🌈 Matemaatikamaa</h1><p>Arvutamine võib olla lõbus! 1.–3. klassile</p></header><section class="panel"><div class="controls"><label>Klass<select id="grade"><option value="1">1. klass</option><option value="2">2. klass</option><option value="3">3. klass</option></select></label><label>Tehted<select id="operation"><option value="mix">Segatehted</option><option value="add">Liitmine</option><option value="sub">Lahutamine</option><option value="mul">Korrutamine</option><option value="div">Jagamine</option></select></label><label>Raskusaste<select id="difficulty"><option value="easy">Kerge</option><option value="medium">Keskmine</option><option value="hard">Raske</option></select></label><label>Režiim<select id="mode"><option value="practice">Harjutamine</option><option value="60">1 minut</option><option value="180">3 minutit</option><option value="300">5 minutit</option></select></label></div><div class="actions"><button id="start">Alusta uut mängu</button><button id="reset" class="secondary">Kustuta salvestatud parim tulemus</button></div></section><section class="panel" id="game" hidden><div class="stats"><div class="stat"><strong id="correct">0</strong>Õigeid</div><div class="stat"><strong id="wrong">0</strong>Valesid</div><div class="stat"><strong id="time">∞</strong>Aega</div></div><div class="question" id="question" aria-live="polite"></div><form class="answer" id="form"><input id="answer" type="number" inputmode="numeric" autocomplete="off" aria-label="Sinu vastus" required><button id="submit">Vasta</button></form><p class="status" id="status" role="status" aria-live="polite"></p><p id="best"></p></section><p class="footer">Tulemused salvestatakse ainult selles brauseris. Isikuandmeid ei koguta.</p></main><script>
const $=id=>document.getElementById(id);let state=null,timer=null;const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;const bestKey=()=>`matemaatikamaa-best-${$('grade').value}-${$('operation').value}-${$('difficulty').value}-${$('mode').value}`;
function makeQuestion(){const grade=+$('grade').value,level=$('difficulty').value,opSetting=$('operation').value;const ops=opSetting==='mix'?(grade===1?['add','sub']:['add','sub','mul','div']):[opSetting];const op=ops[rand(0,ops.length-1)];const max=grade===1?({easy:10,medium:20,hard:50})[level]:grade===2?({easy:20,medium:100,hard:200})[level]:({easy:100,medium:500,hard:1000})[level];let a,b,result; if(op==='add'){a=rand(0,max);b=rand(0,max-a);result=a+b}else if(op==='sub'){a=rand(0,max);b=rand(0,a);result=a-b}else if(op==='mul'){const limit=grade===1?5:grade===2?10:12;const factor=level==='easy'?5:level==='medium'?10:limit;a=rand(1,Math.min(limit,factor));b=rand(1,Math.min(limit,factor));result=a*b}else{const limit=grade===1?5:grade===2?10:12;const factor=level==='easy'?5:level==='medium'?10:limit;b=rand(1,Math.min(limit,factor));result=rand(1,Math.min(limit,factor));a=b*result}return {a,b,op,result}}
function display(){if(!state)return;const symbols={add:'+',sub:'−',mul:'×',div:'÷'};const q=state.question;$('question').textContent=`${q.a} ${symbols[q.op]} ${q.b} = ?`;$('correct').textContent=state.correct;$('wrong').textContent=state.wrong;$('time').textContent=state.remaining===null?'∞':`${state.remaining} s`;$('answer').value='';$('answer').focus();$('best').textContent='Varasem parim tulemus: '+(localStorage.getItem(bestKey())??'puudub')}
function endGame(){if(!state||state.finished)return;state.finished=true;clearInterval(timer);$('answer').disabled=true;$('submit').disabled=true;const score=state.correct;const prev=Number(localStorage.getItem(bestKey())??-1);if(score>prev)localStorage.setItem(bestKey(),String(score));$('status').className='status success';$('status').textContent=`Mäng läbi! Õigeid: ${score}, valesid: ${state.wrong}.`;displaySummary()}
function displaySummary(){$('correct').textContent=state.correct;$('wrong').textContent=state.wrong;$('time').textContent=state.remaining===null?'∞':`${state.remaining} s`;$('question').textContent='🎉 Tubli töö!';$('best').textContent='Sinu parim tulemus selles režiimis: '+localStorage.getItem(bestKey())}
$('start').addEventListener('click',()=>{clearInterval(timer);const seconds=$('mode').value==='practice'?null:Number($('mode').value);state={correct:0,wrong:0,remaining:seconds,finished:false,question:makeQuestion()};$('game').hidden=false;$('answer').disabled=false;$('submit').disabled=false;$('status').textContent='';display();if(seconds!==null){timer=setInterval(()=>{if(!state||state.finished)return;state.remaining--;if(state.remaining<=0)endGame();else $('time').textContent=state.remaining+' s'},1000)}});
$('form').addEventListener('submit',e=>{e.preventDefault();if(!state||state.finished)return;const value=$('answer').value;if(value.trim()==='')return;const ok=Number(value)===state.question.result;if(ok)state.correct++;else state.wrong++;$('status').className='status '+(ok?'success':'error');$('status').textContent=ok?'Õige! 🌟':`Õige vastus oli ${state.question.result}.`;state.question=makeQuestion();display()});
$('reset').addEventListener('click',()=>{localStorage.removeItem(bestKey());$('best').textContent='Varasem parim tulemus: puudub'});
</script></body></html>
